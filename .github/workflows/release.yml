name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo di rilascio"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release guard in app/build.gradle.kts resolves the tag via `git describe`.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            LATEST=${LATEST:-v0.0.0}
            BASE=${LATEST#v}
            MAJOR=${BASE%%.*}
            REST=${BASE#*.}
            MINOR=${REST%%.*}
            PATCH=${REST#*.}
            case "${BUMP}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "::error::Unknown bump '${BUMP}'"; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "::error::Tag ${TAG} already exists"
              exit 1
            fi
            CREATE=true
            echo "${LATEST} + ${BUMP} -> ${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          else
            TAG="${GITHUB_REF_NAME}"
            CREATE=false
          fi

          # The Gradle versioning regex accepts nothing else; fail here rather than mid-build.
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' must be vMAJOR.MINOR.PATCH"
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "create=${CREATE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create annotated tag
        if: steps.version.outputs.create == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Local only: pushed after the build succeeds, so a failure leaves no tag behind.
          git tag -a "${TAG}" -m "KnotSSH ${VERSION}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KNOTSSH_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::Missing secret KNOTSSH_KEYSTORE_B64. An unsigned APK cannot be installed on Android."
            exit 1
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/knotssh-release.jks"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_KNOTSSH_STORE_FILE: ${{ runner.temp }}/knotssh-release.jks
          ORG_GRADLE_PROJECT_KNOTSSH_STORE_PASSWORD: ${{ secrets.KNOTSSH_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KNOTSSH_KEY_ALIAS: ${{ secrets.KNOTSSH_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KNOTSSH_KEY_PASSWORD: ${{ secrets.KNOTSSH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Shred keystore
        if: always()
        run: shred -u "${RUNNER_TEMP}/knotssh-release.jks" 2>/dev/null || rm -f "${RUNNER_TEMP}/knotssh-release.jks"

      - name: Verify signature and stage artifact
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk

          # Gradle silently emits app-release-unsigned.apk when the keystore is missing or unreadable.
          if [ ! -f "${APK}" ]; then
            echo "::error::${APK} not found. Gradle produced: $(ls app/build/outputs/apk/release/ | tr '\n' ' '). Check the signing secrets."
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"

          OUT="KnotSSH-${VERSION}.apk"
          cp "${APK}" "${OUT}"
          {
            echo "apk=${OUT}"
            echo "sha256=$(sha256sum "${OUT}" | cut -d' ' -f1)"
          } >> "${GITHUB_OUTPUT}"

      - name: Push tag
        if: steps.version.outputs.create == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/${TAG}"

      - name: Build release notes
        env:
          APK: ${{ steps.artifact.outputs.apk }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "${PREV}" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi

          {
            echo "## Novità"
            echo
            git log --no-merges --pretty='- %s' "${RANGE}"
            echo
            echo "## Installazione"
            echo
            echo "Scarica \`${APK}\` e installalo sul dispositivo (serve consentire le origini sconosciute)."
            echo
            echo "Verifica l'integrità del file prima di installarlo:"
            echo
            echo '```'
            echo "sha256sum ${APK}"
            echo "${SHA256}"
            echo '```'
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.artifact.outputs.apk }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" "${APK}" \
            --title "KnotSSH ${VERSION}" \
            --notes-file RELEASE_NOTES.md
